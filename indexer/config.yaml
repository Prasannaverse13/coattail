# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Coattail × Perpl: turns raw Perpl Exchange events into a trader leaderboard and a
# per-trader trade stream that the Coattail copy engine polls.
name: coattail-perpl
description: Perpl trader leaderboard + live trade stream for copy-trading on Monad
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: Exchange
    events:
      - event: "AccountCreated(address account, uint256 id)"
      - event: "CollateralDeposit(uint256 accountId, uint256 amountCNS, uint256 balanceCNS)"
      - event: "ContractAdded(uint256 perpId, string name, string symbol, uint8 status, uint256 basePricePNS, uint256 priceDecimals, uint256 lotDecimals, uint256 takerFeePer100K, uint256 makerFeePer100K, uint256 initMarginFracHdths, uint256 maintMarginFracHdths, uint256 maxOpenInterestLNS, uint256 unityDescentThreshHdths, uint256 overColDescentThreshHdths, uint256 dcpBorrowThreshHdths, uint256 priceTolPer100K, uint256 marginTol, uint256 marginTolDecimals, uint256 refPriceMaxAgeSec, uint256 absFundingClampPctPer100K, uint256 permCancelMinOrders, uint256 permCancelSegment, uint256 insAmtPer100K, uint256 liqInsAmtPer100K, uint256 liqUserAmtPer100K, bool btlRestrictBuyers, uint256 btlPriceThreshPer100K, uint256 btlInsAmtPer100K, uint256 btlUserAmtPer100K, uint256 btlBuyerAmtPer100K, uint256 numPerpetuals)"
      - event: "ContractAddedV2(uint256 perpId, string name, string symbol, uint8 status, uint256 basePricePNS, uint256 priceDecimals, uint256 lotDecimals, uint256 initMarginFracHdths, uint256 maintMarginFracHdths, uint256 maxOpenInterestLNS, uint256 unityDescentThreshHdths, uint256 overColDescentThreshHdths, uint256 dcpBorrowThreshHdths, uint256 priceTolPer100K, uint256 marginTol, uint256 marginTolDecimals, uint256 refPriceMaxAgeSec, uint256 absFundingClampPctPer100K, uint256 permCancelMinOrders, uint256 permCancelSegment, uint256 insAmtPer100K, uint256 liqInsAmtPer100K, uint256 liqUserAmtPer100K, bool btlRestrictBuyers, uint256 btlPriceThreshPer100K, uint256 btlInsAmtPer100K, uint256 btlUserAmtPer100K, uint256 btlBuyerAmtPer100K, uint256 numPerpetuals, uint256 perpFeeSchedId)"
      - event: "PositionClosed(uint256 perpId, uint256 accountId, uint8 positionType, uint256 pricePNS, int256 deltaPnlCNS, int256 fundingCNS)"
      - event: "PositionDecreased(uint256 perpId, uint256 accountId, uint8 positionType, uint256 startDepositCNS, uint256 endDepositCNS, uint256 startLotLNS, uint256 endLotLNS, int256 deltaPnlCNS, int256 fundingCNS)"
      - event: "PositionIncreased(uint256 perpId, uint256 accountId, uint8 positionType, uint256 leverageHdths, uint256 startDepositCNS, uint256 endDepositCNS, int256 pnlCollateralizedCNS, int256 premiumPnlSettledCNS, uint256 maxNegPnlCollatBPS, uint256 pricePNS, uint256 startLotLNS, uint256 endLotLNS, uint256 insFeeCNS, uint256 protFeeCNS)"
      - event: "PositionIncreasedV2(uint256 perpId, uint256 accountId, uint8 positionType, uint256 leverageHdths, uint256 startDepositCNS, uint256 endDepositCNS, int256 pnlCollateralizedCNS, int256 premiumPnlSettledCNS, uint256 maxNegPnlCollatBPS, uint256 pricePNS, uint256 startLotLNS, uint256 endLotLNS, uint256 insFeeCNS, uint256 protFeeCNS, uint256 priceResiduePNSQ16)"
      - event: "PositionLiquidated(uint256 perpId, uint256 posAccountId, uint8 positionType, uint256 markPricePNS, uint256 liqPricePNS, uint256 liqLotLNS, uint256 posLotLNS, int256 deltaPnlCNS, int256 fundingCNS, int256 posAmountCNS, uint256 posDepositCNS, int256 accAmountCNS, uint256 accBalanceCNS, bool onOrderBook)"
      - event: "PositionOpened(uint256 perpId, uint256 accountId, uint8 positionType, uint256 leverageHdths, uint256 depositCNS, int256 pnlCollateralizedCNS, uint256 pricePNS, uint256 lotLNS, uint256 insFeeCNS, uint256 protFeeCNS)"
      - event: "PositionOpenedV2(uint256 perpId, uint256 accountId, uint8 positionType, uint256 leverageHdths, uint256 depositCNS, int256 pnlCollateralizedCNS, uint256 pricePNS, uint256 lotLNS, uint256 insFeeCNS, uint256 protFeeCNS, uint256 priceResiduePNSQ16)"
chains:
  - id: 10143 # Monad testnet (HyperSync: https://monad-testnet.hypersync.xyz)
    start_block: 0
    contracts:
      - name: Exchange
        address: "0x1964C32f0bE608E7D29302AFF5E61268E72080cc" # Perpl Exchange (testnet)
